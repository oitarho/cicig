name: cicig

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      VPN_DOMAIN: ${VPN_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing:/srv:ro
      - ./assets:/srv-assets:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks: [web]
    depends_on:
      - panel

  panel:
    build:
      context: .
      dockerfile: panel/Dockerfile
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      VPN_DOMAIN: ${VPN_DOMAIN}
      PANEL_PASSWORD_HASH: ${PANEL_PASSWORD_HASH}
      PANEL_SECRET_KEY: ${PANEL_SECRET_KEY}
      CICIG_CONTROL_DIR: /control
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./control:/control
      - panel_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [web, vpn]

  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    restart: unless-stopped
    environment:
      CICIG_PROJECT_DIR: /opt/cicig
      CICIG_CONTROL_DIR: /control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/cicig:ro
      - ./control:/control
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  wg:
    build:
      context: .
      dockerfile: vpn/wg/Dockerfile
    restart: unless-stopped
    environment:
      CICIG_PROTOCOL: wg
      CICIG_INTERFACE: wg0
      CICIG_NETWORK: 10.8.0.0/24
      CICIG_PORT: ${WG_PORT:-51820}
      VPN_DOMAIN: ${VPN_DOMAIN}
    volumes:
      - wg_data:/data
      - /lib/modules:/lib/modules:ro
    ports:
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [vpn]

  awg:
    build:
      context: .
      dockerfile: vpn/awg/Dockerfile
    restart: unless-stopped
    environment:
      CICIG_PROTOCOL: awg
      CICIG_INTERFACE: awg0
      CICIG_NETWORK: 10.8.0.0/24
      CICIG_PORT: ${AWG_PORT:-443}
      VPN_DOMAIN: ${VPN_DOMAIN}
    volumes:
      - awg_data:/data
    ports:
      - "${AWG_PORT:-443}:${AWG_PORT:-443}/udp"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [vpn]

networks:
  web:
  vpn:

volumes:
  wg_data:
  awg_data:
  caddy_data:
  caddy_config:
  panel_data:
