name: cicig

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      VPN_DOMAIN: ${VPN_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing:/srv:ro
      - ./assets:/srv-assets:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks: [web]
    depends_on:
      - panel

  panel:
    build:
      context: .
      dockerfile: panel/Dockerfile
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      VPN_DOMAIN: ${VPN_DOMAIN}
      PANEL_PASSWORD_HASH: ${PANEL_PASSWORD_HASH}
      PANEL_SECRET_KEY: ${PANEL_SECRET_KEY}
      CICIG_CONTROL_DIR: /control
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./control:/control
      - panel_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [web, vpn]

  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    restart: unless-stopped
    environment:
      CICIG_PROJECT_DIR: /opt/cicig
      CICIG_CONTROL_DIR: /control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/cicig:ro
      - ./control:/control
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  wg-easy:
    # v14 keeps declarative WG_HOST support for generated client configs.
    build:
      context: .
      dockerfile: vpn/wg/Dockerfile
    restart: unless-stopped
    environment:
      LANG: ru
      WG_HOST: ${VPN_DOMAIN}
      WG_PORT: ${WG_PORT:-51820}
      PORT: 51821
      WG_PERSISTENT_KEEPALIVE: 25
      UI_TRAFFIC_STATS: "true"
      UI_CHART_TYPE: 2
    volumes:
      - wg_data:/etc/wireguard
    ports:
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    networks: [vpn]

  awg-easy:
    build:
      context: .
      dockerfile: vpn/awg/Dockerfile
    restart: unless-stopped
    environment:
      LANG: ru
      WG_HOST: ${VPN_DOMAIN}
      WG_PORT: ${AWG_PORT:-443}
      PORT: 51821
      WG_PERSISTENT_KEEPALIVE: 25
    volumes:
      # The app writes here, while this image's wg-quick reads the second path.
      # Both mounts must reference the same volume until upstream aligns them.
      - awg_data:/etc/wireguard
      - awg_data:/etc/amnezia/amneziawg
    ports:
      - "${AWG_PORT:-443}:${AWG_PORT:-443}/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    networks: [vpn]

networks:
  web:
  vpn:

volumes:
  wg_data:
  awg_data:
  caddy_data:
  caddy_config:
  panel_data:
