name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n install.sh scripts/*.sh
          shellcheck install.sh scripts/*.sh
          python -m py_compile panel/app.py
          python -m pip install pip-audit
          python -m pip_audit -r panel/requirements.txt --progress-spinner off
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker run --rm \
            -e PANEL_DOMAIN=panel.example.com \
            -e VPN_DOMAIN=example.com \
            -e LETSENCRYPT_EMAIL=admin@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build control panel
        run: |
          docker build -t cicig-panel:test -f panel/Dockerfile .
          docker run --rm \
            -e PANEL_SECRET_KEY=test-secret \
            -e PANEL_PASSWORD_HASH='$2b$12$Jdts6R6wrbwJDa0K0K2O/.WG8mx35K.D6uS1x80vBkmSjcY6eYHVO' \
            -e PANEL_DOMAIN=panel.example.com \
            -e VPN_DOMAIN=example.com \
            -v "$PWD/tests:/tests:ro" \
            cicig-panel:test \
            python -m unittest discover -s /tests -v
      - name: Build VPN policy images
        run: |
          docker build -t cicig-wg:test -f vpn/wg/Dockerfile .
          docker build -t cicig-awg:test -f vpn/awg/Dockerfile .
