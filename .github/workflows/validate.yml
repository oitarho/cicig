name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n install.sh scripts/*.sh
          shellcheck install.sh scripts/*.sh
          python -m py_compile panel/app.py
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker run --rm \
            -e PANEL_DOMAIN=panel.example.com \
            -e VPN_DOMAIN=example.com \
            -e LETSENCRYPT_EMAIL=admin@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build control panel
        run: |
          docker build -t cicig-panel:test -f panel/Dockerfile .
          docker run --rm \
            -e PANEL_SECRET_KEY=test-secret \
            -e PANEL_PASSWORD_HASH='$$2b$$12$$placeholder' \
            -e PANEL_DOMAIN=panel.example.com \
            -e VPN_DOMAIN=example.com \
            cicig-panel:test \
            python -c "from app import app; c=app.test_client(); assert c.get('/login').status_code == 200; cm=c.session_transaction(); s=cm.__enter__(); s['authenticated']=True; s['csrf']='test'; cm.__exit__(None,None,None); assert c.get('/').status_code == 200; assert c.get('/system').status_code == 200"
